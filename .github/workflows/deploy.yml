name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR=/var/www/video-crm-mvp
            CURRENT_BRANCH=main

            cd "$APP_DIR"

            echo "[deploy] syncing latest code"
            rm -f ".git/refs/remotes/origin/${CURRENT_BRANCH}"
            git fetch --prune origin "$CURRENT_BRANCH"
            git reset --hard "origin/${CURRENT_BRANCH}"

            echo "[deploy] installing dependencies"
            npm install

            echo "[deploy] prisma generate"
            npx prisma generate

            echo "[deploy] prisma migrate deploy"
            npx prisma migrate deploy

            echo "[deploy] clearing stale next build lock"
            rm -f .next/lock

            echo "[deploy] building app"
            npm run build

            echo "[deploy] restarting pm2 processes"
            pm2 restart video-crm-mvp --update-env
            pm2 restart video-crm-worker --update-env || (cd "$APP_DIR" && pm2 start npx --name video-crm-worker -- tsx lib/jobs/index.ts)
            pm2 save

            echo "[deploy] waiting for app health"
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3000 >/dev/null; then
                echo "[deploy] app is healthy"
                exit 0
              fi
              sleep 2
            done

            echo "[deploy] app failed health check"
            exit 1
